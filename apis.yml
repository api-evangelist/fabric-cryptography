aid: fabric-cryptography
name: Fabric Cryptography
description: 'Fabric Cryptography (legal entity Fabric of Truth, Inc.) is a Santa Clara,
  California semiconductor company founded in 2022 that builds the Verifiable Processing
  Unit (VPU) — a custom silicon chip whose instruction set is designed exclusively for
  the mathematical building blocks of modern cryptography. The VPU combines the programmability
  of a GPU with the performance of an ASIC: hundreds of number-theory units for 32-bit
  to 384-bit modular arithmetic, custom hash instructions, software-controlled scratchpad
  memory, a non-blocking network-on-chip, and an on-chip multi-core RISC-V processor for
  native witness generation. Products announced are the FC 1000 chip, the VPU 8060 card
  (three FC 1000 chips, ~1 TB/s memory bandwidth to 30 GB) and the "Byte Smasher" server
  (up to eight VPU 8060 cards). Software is an LLVM-based compiler plus a reconfigurable
  library of primitives targeting plonky2, plonky3, GKR, halo2, Jolt/Lasso, Nova and TFHE,
  with a stated future cloud offering. The company raised $33M in 2024 from Blockchain
  Capital, 1kx, Inflection and Protocol Labs, and has announced collaborations with Polygon
  Labs (AggLayer) and RISC Zero (Boundless). As of this pass Fabric publishes no developer
  program, API, SDK registry package or machine-readable specification of any kind.'
